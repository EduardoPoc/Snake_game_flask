{% extends "base.html" %}

{% block conteudo %}
<h2>Tabuleiro</h2>
<div class="area" role="grid" aria-label="Tabuleiro do Snake">
    {% for linha in area %}
        {% for valor in linha %}
            {% if valor == 'maca' %}
                <div class="celula" id="maca" role="gridcell" aria-label="Posição {{ valor }}"></div>
            {% elif valor in ['cabeca_cobra', 'cobra_cabeca'] %}
                <div class="snake" id="cabeca" role="gridcell" aria-label="Posição {{ valor }}"></div>
            {% elif valor in ['corpo_cobra', 'cobra'] %}
                <div class="snake corpo" role="gridcell" aria-label="Posição {{ valor }}"></div>
            {% else %}
                <div class="celula" role="gridcell" aria-label="Posição {{ valor }}"></div>
            {% endif %}
        {% endfor %}
    {% endfor %}
</div>
{% endblock %}
