{% extends "base.html" %}

{% block conteudo %}
<h2>Tabuleiro</h2>
<div class="area" role="grid" aria-label="Tabuleiro do Snake">
    {% for valor in area %}

        {% if not(valor in cobra['posicao']) %}
            {% if valor == maca%}
                <div class="celula" id='maca'role="gridcell" aria-label="Posição {{ valor }}"></div>
            {% else %}
                <div class="celula" id='vazio'role="gridcell" aria-label="Posição {{ valor }}"></div>
            {% endif %}
        {% else %}
            {% if cobra['posicao'][0] == valor %}
                <div class="snake" id="cabeca" role="gridcell" aria-label="Posição {{ valor }}"></div>
            {% else %}
                <div class="snake" id="corpo" role="gridcell" aria-label="Posição {{ valor }}"></div>
            {% endif %}
        {% endif %}
   
    {% endfor %}
</div>
{% endblock %}
